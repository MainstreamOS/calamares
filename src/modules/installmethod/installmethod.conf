#
# Configuration for the "Get Started" page — a five-card picker shown
# right before netinstall. Each card either skips netinstall (and
# pre-checks a named group on the user's behalf) or sends the user
# into netinstall to pick by hand.
---

# Default choice when the page first opens. One of:
#   "default"    — auto-install everything in the Default Apps group
#   "custom"     — proceed to the netinstall page for hand-picking
#   "developer"  — auto-install the Developer Tools group
#   "gaming"     — auto-install the Gaming group
#   "os-only"    — install nothing from netinstall, base system only
defaultChoice: "default"

# Netinstall group names pre-selected per choice. Each must match a
# group's `name:` exactly in netinstall.conf / netinstall.yaml. An
# empty / missing key leaves the corresponding card functional but
# pre-selects nothing (netinstall falls back to its own `selected:
# true` YAML defaults).
defaultAppsGroupName: "📦 Included Extras"
developerGroupName:   "💻 Developer Tools"
gamingGroupName:      "🎮 Gaming"
