<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Mainstream fork — Material Symbols Rounded "storage" glyph in
     m3onSurface (#e6e1e1) so the storage-device row icon in the partition
     ChoicePage drives combo reads clearly on both #1c1b1c (m3surfaceContainerLow,
     contentFrame) and #2b2a2a (m3surfaceContainerHigh, popup view). The
     upstream icon used the Calamares brand green/red on white, which
     disappears against the dark installer surfaces. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100" height="100">
  <path fill="#e6e1e1" d="M2 20h20v-4H2v4zm2-3h2v2H4v-2zM2 4v4h20V4H2zm4 3H4V5h2v2zm-4 7h20v-4H2v4zm2-3h2v2H4v-2z"/>
</svg>
